<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Benjamin Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        h1 {
            margin-bottom: 16px;
            font-size: 3rem;
        }
        p {
            margin: 0 auto 24px;
            line-height: 1.8;
            max-width: 560px;
            color: #e8f0ff;
        }
        .button {
            display: inline-block;
            padding: 14px 28px;
            background: #ffb347;
            color: #1d1d1d;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 700;
            transition: background 0.25s ease;
        }
        .button:hover {
            background: #ffcc66;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Benjamin's Portfolio</h1>
        <p>Discover creative projects, design work, and development highlights. This landing page is a starting point for exploring the portfolio and learning more about the skills and experiences behind each project.</p>
        <a class="button" href="#portfolio">View Portfolio</a>
    </div>
</body>
</html>
